# Toolchain locations produced by scripts/llvm.sh, scripts/fetch-deps.sh and
# scripts/build-libtcg.sh (versions pinned in scripts/versions.sh). These are
# symlinks into whichever LLVM install the host already has (Homebrew,
# /usr/local, /usr/lib/llvm-N, PATH) or into the pinned release as a fallback,
# so the paths are stable while the LLVM they point at is not.
#
# LLVM is no longer linked as a library (the IR, passes and codegen are in
# crates/biara-ir and crates/biara-lift); only the QEMU TCG lifters are built
# from LLVM bitcode, which is why a clang and its linker are still named here.
[env]
BIARA_LIBTCG_DIR = { value = ".deps/out", relative = true }
# Cross-compiles the test corpora (crates/biara-lift/tests/aarch64.rs). scripts/llvm.sh makes
# this the discovered install's clang, or a wrapper over the system clang when the install is
# dev packages only; cross-linking goes through the lld it provisions.
BIARA_CLANG = { value = ".deps/llvm-23.1.2/bin/clang", relative = true }
# The macOS the LLVM libraries are built for (ignored elsewhere).
MACOSX_DEPLOYMENT_TARGET = "14.0"

# LLVM's static archives come in two flavours and each needs its own linker: the official
# release ships LLVM 23 bitcode, which only its own clang + lld can read, while distro and
# Homebrew installs ship object files for the SDK linker. This clang is a wrapper generated by
# scripts/llvm.sh that does the right thing for the install it found, so these flags exist for
# the bitcode case and are dropped for the other. The ThinLTO cache spares the many test
# binaries from compiling LLVM's bitcode again on every link. zstd and liblzma come from
# Homebrew's static archives. Paths are relative to the workspace root, where rustc runs.
[target.aarch64-apple-darwin]
linker = ".deps/llvm-23.1.2/bin/clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=lld",
    "-C", "link-arg=-Wl,-cache_path_lto,target/lto-cache",
    "-L", "native=.deps/macos-static",
]
