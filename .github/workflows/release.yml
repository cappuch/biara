name: Release

# A `v*` tag builds the Linux x86-64 binaries with their lifters and publishes them, with the
# GPL source of the lifters, as a GitHub release. A manual run builds the same archives as
# workflow artifacts only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  release:
    name: Build release archives
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Build
        run: cargo build --release --locked -p biara-cli -p biara-ui

      - name: Package
        run: |
          source scripts/versions.sh
          version=${GITHUB_REF_NAME#v}
          [[ $GITHUB_REF_TYPE == tag ]] || version=$(git rev-parse --short HEAD)
          name=biara-$version-x86_64-linux
          mkdir -p dist/$name
          # biara-ui and `biara mcp` find the lifters next to the executable; `biara lift`
          # takes BIARA_LIBTCG_DIR.
          cp target/release/biara target/release/biara-ui .deps/out/libtcg-*.so \
            .deps/out/helpers-*.bc dist/$name/
          cp -r LICENSE THIRD_PARTY_NOTICES.md README.md licenses dist/$name/
          cp patches/README.md dist/$name/LIFTERS-LICENSE.md
          tar -C dist -cJf dist/$name.tar.xz $name

          # libtcg-*.so and helpers-*.bc are GPL binaries: ship their corresponding source.
          src=biara-$version-lifters-source
          mkdir -p dist/$src/scripts
          cp .deps/dl/qemu-$QEMU_VERSION.tar.xz dist/$src/
          cp -r patches libtcg dist/$src/
          cp scripts/versions.sh scripts/fetch-deps.sh scripts/build-libtcg.sh \
            scripts/helper-bitcode.py dist/$src/scripts/
          tar -C dist -cJf dist/$src.tar.xz $src

          (cd dist && sha256sum *.tar.xz > SHA256SUMS)
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: biara-x86_64-linux
          path: |
            dist/*.tar.xz
            dist/SHA256SUMS

      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.xz dist/SHA256SUMS \
            --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
